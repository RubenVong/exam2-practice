<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap Home Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <h1>Home Page</h1>

    <h2>Order Management Page</h2>
    <div class="container">
        <div class="col">
            <table id="orderTable" class="table table-bordered table-striped"></table>
        </div>
    </div>

    <h2>Add New Order</h2>
    <div class="container">
        <h3>Create New Order</h3>
        <form id="orderForm">
            <label>Item Name:</label>
            <input id="orderDesc" required>
            <br><br>
            <label>Quantity:</label>
            <input type="number" id="quantity" required>
            <br><br>
            <label>Item Price:</label>
            <input type="number" step="any" id="unitCost" required>
            <br><br>
            <button type="submit" id="unitCost" class="btn btn-primary">Create</button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="orders.js"></script>
</body>

</html>
